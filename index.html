<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bikewatching</title>
    <link rel="stylesheet" href="global.css" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link
      href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="map.css?v=5" />
    <script src="map.js?v=5" type="module"></script>
  </head>
  <body>
    <header>
      <h1>Bikewatching</h1>
      <label class="time-filter" for="time-slider">
        <span>Filter by time:</span>
        <input id="time-slider" type="range" min="-1" max="1440" value="-1" />
        <span class="time-display">
          <time id="selected-time"></time>
          <em id="any-time">(any time)</em>
        </span>
      </label>
    </header>
    <div id="map">
      <svg></svg>
    </div>
  </body>
</html>
